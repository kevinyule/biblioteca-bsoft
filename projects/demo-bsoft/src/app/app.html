<h1>{{ title() }}</h1>

<!-- <lib-text-field label="Nombre"></lib-text-field> -->

<lib-text-field
  [label]="'Nombre'"
  [value]="nombre"
  [required]="true"
  (valueChange)="nombre = $event"
></lib-text-field>


<lib-select-list
  [label]="'Tipo de Fuente'"
  [options]="listaFuentes"
  [value]="fuenteSeleccionada"
  (valueChange)="fuenteSeleccionadaS($event)"
  [required]="true"
></lib-select-list>

<h1>{{fuenteSeleccionada}}</h1>


<lib-data-table
  [data]="usuarios"
  [columns]="[
    { key: 'nombre', label: 'Nombre' },
    { key: 'correo', label: 'Correo' },
    { key: 'rol', label: 'Rol' }
  ]"
  [pageSize]="5"
  [showCheckbox]="true"
  selectionMode="multiple"
  (change)="onSeleccion($event)"
></lib-data-table>


<lib-chart-widget></lib-chart-widget>
