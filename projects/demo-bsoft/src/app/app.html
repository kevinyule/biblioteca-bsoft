<h1>{{ title() }}</h1>

<!-- <lib-text-field label="Nombre"></lib-text-field> -->

<lib-text-field
  [label]="'Nombre'"
  [value]="nombre"
  [required]="true"
  (valueChange)="nombre = $event"
></lib-text-field>


<lib-select-list
  [label]="'Tipo de Fuente'"
  [options]="listaFuentes"
  [value]="fuenteSeleccionada"
  (valueChange)="fuenteSeleccionadaS($event)"
  [required]="true"
></lib-select-list>

<h1>{{fuenteSeleccionada}}</h1>


<lib-data-table
  [data]="usuarios"
  [columns]="[
    { key: 'nombre', label: 'Nombre' },
    { key: 'correo', label: 'Correo' },
    { key: 'rol', label: 'Rol' }
  ]"
  [pageSize]="5"
  [showCheckbox]="true"
  selectionMode="multiple"
  (change)="onSeleccion($event)"
></lib-data-table>


<!-- <lib-chart-widget></lib-chart-widget> -->
<!-- bar - pie - doughnut - radar - polarArea-->
<lib-chart-widget
  [chartType]="'line'"
  [labels]="['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo']"
  [datasets]="[
    { label: 'Ingresos', data: [500, 700, 800, 900, 1100], borderColor: 'green', backgroundColor: 'rgba(0,128,0,0.2)', fill: true },
    { label: 'Egresos', data: [300, 400, 500, 600, 700], borderColor: 'red', backgroundColor: 'rgba(255,0,0,0.2)', fill: true }
  ]"
  title="Ingresos vs Egresos"
></lib-chart-widget>
